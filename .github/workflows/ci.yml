# 桃阅读隔离 CI（审计 T01/F36：安装→类型→规范→单测→构建→E2E，全绿才可合并）
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: typecheck / lint / unit / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖（锁文件驱动）
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate --schema apps/server/prisma/schema.prisma
      - name: 类型检查
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: 单元测试（server + web）
        run: npm run test
      - name: 前端生产构建
        run: npm run build -w @taoread/web

  e2e:
    name: e2e（自起隔离服务）
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prisma generate
        run: npx prisma generate --schema apps/server/prisma/schema.prisma
      # e2e 配置自带隔离：唯一临时库 + 供应商 env 剥离 + 自检端口占用
      - name: E2E（不含 @visual）
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
