<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF4DD" />
    <meta
      name="description"
      content="桃阅读 —— 孩子的阅读游乐园，故事、古诗、英文读物，白天晚上都能读"
    />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-180.png" />
    <!-- docs/34 P1-4：可安装 PWA（图标资产此前已存在但无清单引用=闲置） -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- docs/35 A5：预连接公共媒体域（R2）——书架缩图/阅读器插图的必经之路，省 DNS+TLS 往返 -->
    <link rel="preconnect" href="https://media.taostudioai.com" />
    <!-- 展示字体自托管（红线：孩子端零第三方外链）；swap 保证弱网下先渲染系统回退字体 -->
    <link
      rel="preload"
      href="/fonts/baloo2-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/baloo2-latin-ext.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>桃阅读</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
