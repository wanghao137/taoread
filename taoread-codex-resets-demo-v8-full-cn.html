};
const books=[
{id:'nature',title:'\u665a\u5b89\u81ea\u7136\u8bfe \u00b7 \u8282\u6c14\u6545\u4e8b',author:'\u6843\u9605\u8bfb\u539f\u521b',tone:'mint',meta:'6 \u7ae0 \u00b7 \u81ea\u7136',progress:62,fav:true,desc:'\u8ddf\u7740\u98ce\u3001\u96e8\u3001\u690d\u7269\u548c\u8282\u6c14\uff0c\u8ba4\u8bc6\u4e00\u5e74\u91cc\u6084\u6084\u53d1\u751f\u7684\u53d8\u5316\u3002'},
{id:'rhymes',title:'一个孩子的诗园',author:'罗伯特·路易斯·史蒂文森',tone:'rose',meta:'6 \u7ae0 \u00b7 英文',progress:18,fav:false,desc:'\u6e29\u67d4\u7684\u82f1\u6587\u7ae5\u8bd7\uff0c\u9002\u5408\u6162\u6162\u8bfb\uff0c\u4e5f\u9002\u5408\u4e00\u8d77\u542c\u3002'},
{id:'idioms',title:'\u6210\u8bed\u6545\u4e8b \u00b7 \u8349\u6728\u7bc7',author:'\u6c11\u95f4\u6545\u4e8b\u6539\u5199',tone:'orange',meta:'5 \u7ae0 \u00b7 \u6545\u4e8b',progress:0,fav:true,desc:'\u628a\u719f\u6089\u7684\u6210\u8bed\u91cd\u65b0\u53d8\u6210\u53ef\u4ee5\u60f3\u8c61\u3001\u53ef\u4ee5\u804a\u5929\u7684\u5c0f\u6545\u4e8b\u3002'},
{id:'cloud',title:'\u58f0\u5f8b\u542f\u8499 \u00b7 \u4e91\u5bf9\u96e8',author:'\u8f66\u4e07\u80b2',tone:'sun',meta:'2 \u7ae0 \u00b7 \u8499\u5b66',progress:0,fav:false,desc:'\u8bfb\u51fa\u4e2d\u6587\u7684\u8282\u594f\uff0c\u548c\u7238\u7238\u5988\u5988\u4e00\u8d77\u73a9\u201c\u4f60\u4e00\u53e5\u3001\u6211\u4e00\u53e5\u201d\u3002'},
{id:'night',title:'\u9759\u591c\u4e0e\u5c71\u6c34',author:'\u53e4\u8bd7\u9009',tone:'rose',meta:'7 \u7ae0 \u00b7 \u53e4\u8bd7',progress:100,fav:true,desc:'\u4e03\u9996\u9002\u5408\u6162\u6162\u5ff5\u7684\u5c71\u6c34\u8bd7\u3002'},
{id:'peter',title:'彼得兔的故事',author:'碧雅翠丝·波特',tone:'mint',meta:'8 \u7ae0 \u00b7 英文',progress:0,fav:true,desc:'\u4e00\u53ea\u597d\u5947\u7684\u5c0f\u5154\u5b50\uff0c\u628a\u82b1\u56ed\u53d8\u6210\u4e86\u4e00\u573a\u5192\u9669\u3002'}
];
let S={page:'home',filter:'all',shelf:'all',book:books[0],theme:'paper',font:22,settings:false,speaking:false,toast:''};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function cover(b){return `<div class="book-cover ${b.tone}"><span class="cover-kicker">桃阅读 · 故事</span><span class="cover-title">${esc(b.title)}</span><button class="fav ${b.fav?'on':''}" onclick="event.stopPropagation();toggleFav('${b.id}')">${b.fav?'&#9829;':'+'}</button></div>`}
function navButton(p,label){return `<button class="${S.page===p?'on':''}" onclick="go('${p}')">${label}</button>`}
function base(content,title,sub){return `<div class="app"><div class="wrap"><header class="mast"><div class="logo"></div><div class="brand"><h1>桃阅读</h1><p>贴纸绘本 · 儿童阅读空间</p></div><div class="mast-actions"><button class="sticker-btn" onclick="toast('阅读记忆已打开')">阅读记忆</button><button class="sticker-btn primary" onclick="go('discover')">找故事</button></div></header><div class="layout"><aside class="side"><p class="side-label">导航</p><nav class="nav">${navButton('home',T.home)}${navButton('discover',T.discover)}${navButton('shelf',T.shelf)}</nav><div class="side-card"><b>${T.together}</b><p>本周共读 4 次</p></div></aside><main class="main"><div class="page-head"><span class="page-index">01 / 桃阅读</span><h2>${title}</h2><p>${sub}</p></div>${content}</main></div><nav class="mobile-nav">${navButton('home',T.home)}${navButton('discover',T.discover)}${navButton('shelf',T.shelf)}</nav></div></div>`}
function storyCard(b){return `<div class="story-card" role="button" tabindex="0" onclick="openBook('${b.id}')" onkeydown="if(event.key==='Enter'||event.key===' ')openBook('${b.id}')">${cover(b)}<div class="story-meta"><b>${esc(b.title)}</b><small>${esc(b.author)} / ${esc(b.meta)}</small></div></div>`}
function home(){const b=books[0];return base(`<section class="hero"><div class="hero-grid"><div><span class="mono-label">今天的故事 / ${T.continue}</span><div class="hero-title"><span class="marker">${esc(b.title)}</span></div><p class="hero-copy">${esc(b.desc)}</p><div class="hero-actions"><button class="sticker-btn primary" onclick="readBook('${b.id}')">${T.continue阅读}</button><button class="sticker-btn" onclick="openBook('${b.id}')">${T.look}</button></div></div>${cover(b)}</div></section><section class="metrics"><div class="metric"><span>本周共读</span><strong>4</strong></div><div class="metric"><span>收藏句子</span><strong>7</strong></div><div class="metric"><span>读完故事</span><strong>2</strong></div></section><section class="section"><div class="section-head"><span class="section-no">02</span><h3>${T.pick3}</h3><p>${T.pickDesc}</p></div><div class="story-row">${books.slice(1,4).map(storyCard).join('')}</div></section><section class="section"><div class="section-head"><span class="section-no">03</span><h3>${T.mood}</h3><p>先凭感觉，再看分类</p></div><div class="mood-row"><button class="mood" onclick="mood('story')">想笑一笑</button><button class="mood" onclick="mood('story')">想去冒险</button><button class="mood" onclick="mood('poem')">想安静一下</button><button class="mood" onclick="mood('english')">想听英文</button></div></section><section class="section"><div class="section-head"><span class="section-no">04</span><h3>阅读节奏</h3><p>不是连续打卡，只是一起读过的痕迹</p></div>${calendar()}</section><section class="section"><div class="section-head"><span class="section-no">05</span><h3>家庭记忆</h3><p>我们一起读过的片段</p></div>${speechList()}</section>`,T.today,T.hello)}
function calendar(){let h='<div class="calendar"><div class="calendar-top"><b>近 26 周阅读记录</b><span>橙色 = 一起读过</span></div><div class="cells">';for(let i=0;i<104;i++){const hit=[3,7,12,18,19,27,31,38,44,45,53,59,61,69,74,82,89,96,101].includes(i);h+=`<i class="cell ${hit?'hit':''}"></i>`}return h+'</div></div>'}
function speechList(){return `<div class="speech-list"><div class="speech-row"><div class="avatar">妈</div><div class="speech"><time>昨天</time><p>${'\u201c\u98ce\u628a\u6811\u53f6\u7ffb\u8fc7\u53bb\uff0c\u79cb\u5929\u5c31\u9732\u51fa\u4e86\u4e00\u5c0f\u89d2\u3002\u201d'}</p></div></div><div class="speech-row"><div class="avatar">桃</div><div class="speech"><time>3 天前</time><p>${'\u4e00\u8d77\u8bfb\u5b8c\u4e86\u300a\u9759\u591c\u4e0e\u5c71\u6c34\u300b\uff0c\u7559\u4e0b\u4e86 2 \u53e5\u559c\u6b22\u7684\u8bdd\u3002'}</p></div></div></div>`}
function discover(){const fs=[['all',T.all],['story',T.story],['poem',T.poem],['nature',T.nature],['english','英文']];const list=filteredBooks();return base(`<div class="search-wrap"><input id="search" class="search" placeholder="${T.search}" oninput="liveSearch(this.value)"><button class="sticker-btn hot" onclick="randomBook()">随机一本</button></div><div class="filter-row">${fs.map(x=>`<button class="filter ${S.filter===x[0]?'on':''}" onclick="setFilter('${x[0]}')">${x[1]}</button>`).join('')}</div><div id="library" class="library">${list.map(storyCard).join('')}</div>`,T.discover,'先看封面，再决定要不要打开。')}
function filteredBooks(){if(S.filter==='all')return books;if(S.filter==='english')return books.filter(b=>b.meta.includes('英文'));if(S.filter==='nature')return books.filter(b=>b.id==='nature');if(S.filter==='poem')return books.filter(b=>b.id==='night'||b.id==='cloud');return books.filter(b=>b.id==='idioms'||b.id==='peter')}
function shelf(){const tabs=[['all',T.all],['reading',T.reading],['liked',T.liked],['done',T.done]];let arr=books;if(S.shelf==='reading')arr=books.filter(b=>b.progress>0&&b.progress<100);if(S.shelf==='liked')arr=books.filter(b=>b.fav);if(S.shelf==='done')arr=books.filter(b=>b.progress===100);return base(`<div class="tabs">${tabs.map(x=>`<button class="tab ${S.shelf===x[0]?'on':''}" onclick="setShelf('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="library">${arr.map(storyCard).join('')}</div><section class="section"><div class="section-head"><span class="section-no">02</span><h3>我的阅读地图</h3><p>${T.shelfSub}</p></div>${calendar()}</section>`,T.shelf,T.shelfSub)}
function detail(b){return `<div class="app"><div class="wrap"><header class="mast"><div class="logo"></div><div class="brand"><h1>桃阅读</h1><p>书籍详情</p></div><div class="mast-actions"><button class="sticker-btn" onclick="go('shelf')">${T.back}</button></div></header><main class="main"><div class="detail-grid"><div class="detail-cover">${cover(b)}</div><div><span class="mono-label">适合一起读</span><div class="detail-title"><span class="marker">${esc(b.title)}</span></div><div class="detail-author">${esc(b.author)} / ${esc(b.meta)}</div><p class="detail-intro">${esc(b.desc)} ${'\u8fd9\u91cc\u4e0d\u7528\u661f\u7ea7\u7ed9\u5b69\u5b50\u8d34\u201c\u96be\u5ea6\u201d\u6807\u7b7e\uff0c\u53ea\u544a\u8bc9\u5bb6\u5ead\u8fd9\u672c\u4e66\u600e\u4e48\u8bfb\u4f1a\u66f4\u8212\u670d\u3002'}</p><div class="hero-actions"><button class="sticker-btn primary" onclick="readBook('${b.id}')">${b.progress>0&&b.progress<100?T.continue阅读:T.start}</button><button class="sticker-btn" onclick="preview()">${T.preview}</button><button class="sticker-btn" onclick="toggleFav('${b.id}')">${b.fav?T.liked已读完:T.like}</button></div><div class="info-stickers"><div class="info"><small>阅读节奏</small><b>慢慢读</b></div><div class="info"><small>陪伴方式</small><b>轮流读</b></div><div class="info"><small>朗读方式</small><b>大声朗读</b></div></div></div></div><section class="section"><div class="section-head"><span class="section-no">02</span><h3>${T.chapters}</h3><p>一次只打开一个小故事</p></div><div class="chapter-list">${['\u98ce\u4ece\u54ea\u91cc\u6765','\u6811\u53f6\u4e3a\u4ec0\u4e48\u4f1a\u53d8\u8272','\u767d\u9732\u843d\u5728\u8349\u5c16\u4e0a','\u4e00\u573a\u6162\u6162\u53d8\u5c0f\u7684\u96e8'].map((x,i)=>`<button class="chapter" onclick="readBook('${b.id}')"><span class="num">0${i+1}</span><b>${x}</b><em>${i===1?'上次读到这里':'打开'}</em></button>`).join('')}</div></section></main></div></div>`}
function reader(b){return `<div class="reader ${S.theme}"><header class="reader-top"><button onclick="openBook('${b.id}')">${T.readerBack}</button><span class="mono-label">第 02 章 / ${esc(b.title)}</span><button onclick="toggleSettings()">排版</button></header><main class="reader-body"><div class="reader-label">第二章</div><h2>${'\u6811\u53f6\u4e3a\u4ec0\u4e48\u4f1a\u53d8\u8272'}</h2><div class="reader-art"></div><div class="reader-text" style="font-size:${S.font}px"><p class="${S.speaking?'speaking':''}">${'\u79cb\u5929\u6765\u7684\u65f6\u5019\uff0c\u6811\u53f6\u5e76\u4e0d\u662f\u4e00\u4e0b\u5b50\u5c31\u53d8\u9ec4\u4e86\u3002\u5148\u662f\u6e05\u6668\u7684\u98ce\u51c9\u4e86\u4e00\u70b9\uff0c\u592a\u9633\u843d\u5c71\u5f97\u65e9\u4e86\u4e00\u70b9\uff0c\u6811\u4e5f\u6162\u6162\u5f00\u59cb\u628a\u590f\u5929\u6536\u8d77\u6765\u3002'}</p><p>${'\u53f6\u5b50\u91cc\u539f\u672c\u85cf\u7740\u5f88\u591a\u7eff\u8272\u3002\u5929\u6c14\u53d8\u51c9\u4ee5\u540e\uff0c\u7eff\u8272\u4e00\u70b9\u4e00\u70b9\u9000\u4e0b\u53bb\uff0c\u9ec4\u8272\u3001\u6a59\u8272\u548c\u7ea2\u8272\u624d\u4ece\u91cc\u9762\u9732\u51fa\u6765\u3002'}</p><p>${'\u5982\u679c\u4f60\u548c\u7238\u7238\u5988\u5988\u4e00\u8d77\u6563\u6b65\uff0c\u53ef\u4ee5\u6361\u4e00\u7247\u521a\u521a\u53d8\u8272\u7684\u53f6\u5b50\u3002\u770b\u770b\u5b83\u662f\u4ece\u8fb9\u7f18\u5f00\u59cb\uff0c\u8fd8\u662f\u4ece\u53f6\u8109\u65c1\u8fb9\u5f00\u59cb\u3002'}</p></div></main><footer class="reader-controls"><button class="main-action" onclick="toggleSpeak()">${S.speaking?T.stop:T.speak}</button><button onclick="fontSize(-1)">小字</button><button onclick="fontSize(1)">大字</button><button onclick="toggleSettings()">${T.settings}</button><button onclick="finishRead()">${T.finish}</button></footer>${S.settings?`<section class="settings"><h3>${T.settings}</h3><div class="setting-row"><button onclick="setTheme('paper')">${T.paper}</button><button onclick="setTheme('sepia')">${T.sepia}</button><button onclick="setTheme('night')">${T.night}</button></div><div class="setting-row"><button onclick="fontSize(-1)">${T.small}</button><button onclick="fontSize(1)">${T.large}</button><span class="mono-label">字号 ${S.font}</span></div></section>`:''}</div>`}
function finish(){return `<div class="finish"><section class="finish-card"><span class="mono-label">阅读已保存</span><h2><span class="marker">${T.finishTitle}</span></h2><p>${'\u4e0d\u7528\u79ef\u5206\uff0c\u4e5f\u4e0d\u7528\u8fde\u7eed\u6253\u5361\u3002\u4eca\u5929\u4e00\u8d77\u8bfb\u8fc7\u7684\u8fd9\u4e00\u5c0f\u6bb5\uff0c\u5df2\u7ecf\u88ab\u597d\u597d\u4fdd\u5b58\u3002'}</p><div class="finish-stats"><div><small>共读时长</small><b>12 分钟</b></div><div><small>收藏句子</small><b>2</b></div><div><small>本次共读</small><b>1 次</b></div></div><div class="hero-actions" style="justify-content:center"><button class="sticker-btn primary" onclick="go('home')">${T.homeAgain}</button><button class="sticker-btn" onclick="go('shelf')">${T.shelf}</button></div></section></div>`}
function render(){let html=S.page==='home'?home():S.page==='discover'?discover():S.page==='shelf'?shelf():S.page==='detail'?detail(S.book):S.page==='reader'?reader(S.book):finish();document.getElementById('root').innerHTML=html+(S.toast?`<div class="toast">${esc(S.toast)}</div>`:'')}
function go(p){S.page=p;S.settings=false;S.speaking=false;render();scrollTo({top:0,behavior:'smooth'})}
function openBook(id){S.book=books.find(b=>b.id===id)||books[0];S.page='detail';S.settings=false;render();scrollTo({top:0,behavior:'smooth'})}
function readBook(id){S.book=books.find(b=>b.id===id)||books[0];S.page='reader';S.settings=false;S.speaking=false;render();scrollTo(0,0)}
function setFilter(f){S.filter=f;render()}function setShelf(x){S.shelf=x;render()}function mood(f){S.filter=f;S.page='discover';render()}function randomBook(){openBook(books[Math.floor(Math.random()*books.length)].id)}
function liveSearch(q){q=q.trim().toLowerCase();const list=books.filter(b=>!q||(`${b.title} ${b.author} ${b.meta} ${b.desc}`).toLowerCase().includes(q));const el=document.getElementById('library');if(el)el.innerHTML=list.map(storyCard).join('')||'<p class="mono-label">没找到，换个词试试。</p>'}
function toggleFav(id){const b=books.find(x=>x.id===id);if(b)b.fav=!b.fav;if(S.book.id===id)S.book=b;toast(b&&b.fav?'已放进“喜欢”':'已从“喜欢”移除')}
function preview(){toast('正在试听一小段')}
function toggleSettings(){S.settings=!S.settings;render()}function setTheme(t){S.theme=t;S.settings=true;render()}function fontSize(n){S.font=Math.max(18,Math.min(30,S.font+n));render()}function toggleSpeak(){S.speaking=!S.speaking;render();toast(S.speaking?'正在朗读':'已停止朗读')}function finishRead(){S.page='finish';S.speaking=false;render();scrollTo(0,0)}
function toast(m){S.toast=m;render();setTimeout(()=>{S.toast='';render()},1100)}
render();
</script>
</body>
</html>
